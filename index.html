<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma Maker — Simulação de RH</title>
<style>
  :root {
    color-scheme: light;
    --accent: #b85d19;
    --accent-text: #96470c;
    --bg: #f2f3f5;
    --surface: #ffffff;
    --sidebar: #1b2128;
    --sidebar-text: #c7cbd1;
    --sidebar-hover: #262e38;
    --border: #d5d8dc;
    --text: #22262a;
    --muted: #5f6670;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --header-h: 42px;
    --subbar-h: 36px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-size: 13px; line-height: 1.4; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .print-only { display: none; }

  /* ---------- Estrutura ---------- */
  .erp { display: flex; min-height: 100vh; flex-direction: column; }
  .topbar {
    min-height: var(--header-h); background: #14181d; color: #eaedf0;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 6px; padding: 4px 14px; border-bottom: 1px solid #0a0c0e;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; letter-spacing: .3px; }
  .brand i { color: #f59e0b; font-style: normal; }
  .brand-sub { font-size: 10px; background: #262e38; color: #a4abb5; padding: 2px 6px; text-transform: uppercase; font-weight: 600; }
  .top-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .top-company { font-size: 11px; color: #9ca3af; margin-right: 8px; }
  .top-company strong { color: #fff; }

  .body { display: flex; flex: 1; }
  .sidebar { width: 230px; background: var(--sidebar); color: var(--sidebar-text); display: flex; flex-direction: column; flex-shrink: 0; }
  .chip { padding: 10px 14px; border-bottom: 1px solid #2f3844; background: #161b21; }
  .chip-label { font-size: 10px; text-transform: uppercase; color: #868e96; font-weight: 600; }
  .chip-name { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav { list-style: none; margin: 0; padding: 6px 0; flex: 1; }
  .nav button {
    width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 14px; background: none; border: 0;
    border-left: 3px solid transparent; color: var(--sidebar-text); font-size: 12px; font-weight: 500; text-align: left; cursor: pointer;
  }
  .nav button:hover { background: var(--sidebar-hover); color: #fff; }
  .nav button.active { background: #242c36; color: #fff; border-left-color: var(--accent); font-weight: 600; }
  .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .nav-ico { width: 14px; text-align: center; opacity: .85; font-size: 11px; }
  .side-foot { padding: 10px 14px; font-size: 10.5px; color: #6b7280; border-top: 1px solid #11151a; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .subbar {
    min-height: var(--subbar-h); background: #fff; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; padding: 4px 16px;
  }
  .crumb { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .crumb strong { color: var(--text); }
  .subbar-actions { display: flex; gap: 6px; }
  .content { padding: 16px; flex: 1; }
  .foot {
    padding: 10px 16px; background: #e9ebed; border-top: 1px solid var(--border); font-size: 11px; color: #555d67;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px;
  }

  /* ---------- Botões ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 11px; font-weight: 600;
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 2px; background: #fff; color: var(--text);
    cursor: pointer; line-height: 1; white-space: nowrap;
  }
  .btn:hover { background: #f4f5f7; border-color: #bcc1c8; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn-primary { background: var(--accent); border-color: #9c4c0f; color: #fff; }
  .btn-primary:hover { background: #a55212; border-color: #833e0a; }
  .btn-danger { color: #b91c1c; border-color: #fca5a5; }
  .btn-danger:hover { background: #fef2f2; border-color: #ef4444; }
  .btn-danger.solid { background: #b91c1c; border-color: #991b1b; color: #fff; }
  .btn-danger.solid:hover { background: #991b1b; }
  .btn-sm { padding: 4px 7px; font-size: 10.5px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }

  /* ---------- Tabelas ---------- */
  .table-card { background: #fff; border: 1px solid var(--border); overflow: hidden; }
  .toolbar {
    padding: 8px 12px; background: #fafbfc; border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
  }
  .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .toolbar-title { font-weight: 700; font-size: 12px; text-transform: uppercase; }
  .table-scroll { overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
  .tbl th {
    background: #ebedf0; color: #374151; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .3px;
    padding: 7px 10px; border-bottom: 1px solid var(--border); border-right: 1px solid #e1e4e8; white-space: nowrap;
  }
  .tbl td { padding: 6px 10px; border-bottom: 1px solid #edf0f2; border-right: 1px solid #f2f4f6; vertical-align: middle; height: 32px; }
  .tbl th:last-child, .tbl td:last-child { border-right: 0; }
  .tbl tbody tr:nth-child(even) td { background: #fafbfc; }
  .tbl tbody tr:hover td { background: #f0f4f8; }
  .tbl .num { text-align: right; }
  .tbl .ctr { text-align: center; }
  .tbl .acts { text-align: right; white-space: nowrap; }
  .tbl .acts .btn + .btn { margin-left: 4px; }
  .empty { text-align: center; padding: 20px !important; color: var(--muted); }

  /* ---------- Formulários ---------- */
  .inp, .sel, .txt {
    font-size: 12px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 2px; background: #fff; color: var(--text);
    font-family: inherit; max-width: 100%;
  }
  .inp:focus, .sel:focus, .txt:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .w100 { width: 100%; }
  .txt { resize: vertical; }
  .fg { margin-bottom: 10px; }
  .fl { display: block; font-size: 11px; font-weight: 600; margin-bottom: 3px; color: #495057; text-transform: uppercase; letter-spacing: .3px; }
  .hint { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .row { display: grid; gap: 10px; }
  .row.c2 { grid-template-columns: 1fr 1fr; }
  .row.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .row.c4 { grid-template-columns: repeat(4, 1fr); }
  .row.c5 { grid-template-columns: repeat(5, 1fr); }
  .row.w21 { grid-template-columns: 2fr 1fr; }
  .row.w211 { grid-template-columns: 2fr 1fr 1fr; }
  .avg-preview { margin-top: 8px; font-size: 12px; }

  /* ---------- Cards ---------- */
  .card { background: #fff; border: 1px solid var(--border); padding: 14px; margin-bottom: 14px; }
  .card-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; margin: 0 0 10px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border); color: #1e2329; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .grid-2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; }
  .grid-eq { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-an { display: grid; grid-template-columns: 240px 1fr; gap: 14px; }
  .grid-pol { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: #fff; border: 1px solid var(--border); padding: 10px 12px; border-left: 3px solid #6b7280; }
  .kpi.accent { border-left-color: var(--accent); }
  .kpi-label { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .kpi-val { font-size: 22px; font-weight: 700; color: #1b2128; line-height: 1.2; margin-top: 2px; }
  .kpi-val small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .kv { width: 100%; font-size: 12px; border-collapse: collapse; }
  .kv td { padding: 4px 0; vertical-align: top; }
  .kv td:first-child { color: var(--muted); width: 130px; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .quick .btn { padding: 10px 6px; }

  .didactic { background: #fdfaf6; border: 1px solid #f0d9c4; border-left: 3px solid var(--accent); padding: 8px 12px; margin-bottom: 12px; font-size: 11.5px; color: #4a3a2a; }
  .didactic-head {
    width: 100%; background: none; border: 0; padding: 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; text-transform: uppercase; font-size: 10.5px; letter-spacing: .4px; color: inherit; text-align: left;
  }
  .didactic-body { margin-top: 6px; line-height: 1.5; }
  .didactic.collapsed .didactic-body { display: none; }

  .tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; text-transform: uppercase; letter-spacing: .3px; border: 1px solid #d1d5db; background: #f3f4f6; color: #374151; border-radius: 2px; }
  .tag-green { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
  .tag-blue { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
  .tag-amber { background: #fffbeb; border-color: #fde68a; color: #92400e; }
  .tag-red { background: #fef2f2; border-color: #fecaca; color: #991b1b; }

  .notice { font-size: 11px; background: #f8fafc; border: 1px solid #cbd5e1; padding: 7px 10px; color: #475569; margin-top: 10px; line-height: 1.45; }
  .notice.warn { background: #fffbeb; border-color: #fde68a; color: #92400e; }
  .notice.danger { background: #fef2f2; border-color: #fecaca; color: #991b1b; }

  .cargo-list { list-style: none; margin: 0; padding: 4px 0; }
  .cargo-list li { border-bottom: 1px solid #f0f2f4; }
  .cargo-list button {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 8px 10px; background: none; border: 0;
    font-size: 11.5px; text-align: left; cursor: pointer; color: inherit;
  }
  .cargo-list button:hover { background: #f4f6f8; }
  .cargo-list button.sel { color: var(--accent-text); font-weight: 700; background: #fdf6ee; }
  .pol-body { font-size: 11.5px; color: #374151; line-height: 1.5; white-space: pre-line; max-height: 160px; overflow-y: auto; padding-right: 4px; }

  /* ---------- Seleção de empresa ---------- */
  .select-screen { min-height: 100vh; background: #0f1318; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .select-card { background: #fff; width: 100%; max-width: 700px; border: 1px solid #2d3748; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .select-head { background: #181f28; padding: 16px 20px; border-bottom: 2px solid var(--accent); color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .select-body { padding: 18px 20px; }
  .company-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--border); background: #fafbfc; margin-bottom: 8px; }
  .company-row:hover { background: #f1f4f8; }
  .company-actions { display: flex; gap: 5px; flex-wrap: wrap; }
  .dashed { padding: 24px; text-align: center; border: 1px dashed var(--border); background: #fafafa; font-size: 12px; color: var(--muted); }

  /* ---------- Modais ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(16,21,28,.65); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal { background: #fff; width: 100%; max-width: 580px; max-height: 92vh; display: flex; flex-direction: column; border: 1px solid #9aa0a6; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  .modal.lg { max-width: 760px; }
  .modal.sm { max-width: 400px; }
  .modal-head { background: #1b2128; color: #fff; padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin: 0; }
  .modal-x { background: transparent; border: 0; color: #9ca3af; cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; }
  .modal-x:hover { color: #fff; }
  .modal-body { padding: 14px; overflow-y: auto; flex: 1; }
  .modal-foot { background: #f7f8f9; padding: 8px 12px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 6px; }
  .modal form { display: flex; flex-direction: column; min-height: 0; flex: 1; }

  #toast-root { position: fixed; right: 16px; bottom: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: min(360px, calc(100vw - 32px)); }
  .toast { background: #1b2128; color: #fff; padding: 10px 14px; font-size: 12px; border-left: 3px solid #10b981; box-shadow: 0 4px 12px rgba(0,0,0,.3); border-radius: 2px; }
  .toast.err { border-left-color: #ef4444; }

  /* ---------- Responsivo ---------- */
  @media (max-width: 900px) {
    .body { flex-direction: column; }
    .sidebar { width: 100%; }
    .nav { display: flex; flex-wrap: wrap; }
    .nav li { flex: 1 1 50%; }
    .grid-2, .grid-eq, .grid-an { grid-template-columns: 1fr; }
    .row.c3, .row.c4, .row.w21, .row.w211 { grid-template-columns: 1fr 1fr; }
    .row.c5 { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 520px) {
    .row.c2, .row.c3, .row.c4, .row.w21, .row.w211 { grid-template-columns: 1fr; }
    .row.c5 { grid-template-columns: 1fr 1fr; }
    .content { padding: 10px; }
  }

  /* ---------- Impressão ---------- */
  @media print {
    .topbar, .sidebar, .subbar-actions, #modal-root, #toast-root, .btn, .toolbar, .didactic, .foot { display: none !important; }
    html, body, .main { background: #fff !important; color: #000 !important; }
    .print-only { display: block; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .card, .table-card, .kpi { border: 1px solid #000 !important; break-inside: avoid; }
    .content { padding: 0; }
    .table-scroll { overflow: visible; }
  }

  /* ---------- Fotos, tabela salarial e exportação ---------- */
  .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; background: #e5e7eb; flex-shrink: 0; }
  .avatar.ph { font-size: 11px; font-weight: 700; color: #4b5563; }
  .name-cell { display: flex; align-items: center; gap: 8px; }
  .photo-row { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; padding: 10px; border: 1px dashed var(--border); background: #fafbfc; }
  .photo-preview { width: 84px; height: 84px; flex-shrink: 0; border: 1px solid var(--border); background: #e5e7eb; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-preview span { font-size: 11px; color: var(--muted); text-align: center; padding: 4px; }
  .photo-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .gen-box { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 10px; padding: 8px 10px; background: #fdfaf6; border: 1px solid #f0d9c4; }
  .steps-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .check-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-bottom: 10px; }
  .check-list label { display: flex; align-items: center; gap: 7px; font-size: 12px; cursor: pointer; padding: 6px 8px; border: 1px solid var(--border); background: #fff; }
  .check-list label:hover { background: #f4f6f8; }
  .check-inline { display: flex; align-items: center; gap: 7px; font-size: 12px; cursor: pointer; padding: 6px 0; }
  #print-root { display: none; }
  @media (max-width: 520px) {
    .gen-box { grid-template-columns: 1fr; }
    .steps-grid { grid-template-columns: 1fr 1fr; }
    .check-list { grid-template-columns: 1fr; }
    .photo-row { flex-direction: column; align-items: flex-start; }
  }

  /* ---------- Documento PDF (impressão das guias escolhidas) ---------- */
  @media print {
    body.printing-export #app, body.printing-export #modal-root, body.printing-export #toast-root { display: none !important; }
    body.printing-export #print-root { display: block !important; }
    body.printing-export { background: #fff !important; color: #000 !important; font-size: 10pt; }
    .pdoc-head { border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 12px; }
    .pdoc-brand { font-size: 9pt; text-transform: uppercase; letter-spacing: .5px; color: #444; }
    .pdoc-head h1 { font-size: 17pt; margin: 2px 0; }
    .pdoc-meta { font-size: 9pt; color: #444; }
    .psec { break-before: page; page-break-before: always; }
    .psec:first-of-type { break-before: auto; page-break-before: auto; }
    .psec h2 { font-size: 13pt; margin: 0 0 8px; padding-bottom: 4px; border-bottom: 1px solid #000; text-transform: uppercase; }
    .psec h3 { font-size: 11pt; margin: 14px 0 4px; }
    .ptbl { width: 100%; border-collapse: collapse; font-size: 9pt; margin-bottom: 10px; }
    .ptbl th, .ptbl td { border: 1px solid #888; padding: 4px 6px; text-align: left; vertical-align: middle; }
    .ptbl th { background: #e5e7eb !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .ptbl thead { display: table-header-group; }
    .ptbl tr { break-inside: avoid; page-break-inside: avoid; }
    .ptbl .num { text-align: right; }
    .ptbl .ctr { text-align: center; }
    .ptbl .k { width: 190px; font-weight: 700; background: #f3f4f6 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pimg { width: 38px; height: 38px; object-fit: cover; border-radius: 50%; display: block; }
    .ppara { font-size: 10pt; line-height: 1.5; white-space: pre-line; margin: 0 0 8px; }
    .pblock { break-inside: avoid; page-break-inside: avoid; margin-bottom: 12px; }
    .pblock ul, .pblock ol { margin: 4px 0 8px 18px; padding: 0; font-size: 10pt; }
    .pmuted { color: #555; }
  }
</style>
</head>
<body>
<noscript>Esta plataforma precisa de JavaScript habilitado para funcionar.</noscript>
<div id="app"></div>
<div id="modal-root"></div>
<div id="print-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept=".json,application/json" class="hidden">

<script>
(function () {
  'use strict';

  /* =========================================================
     ARMAZENAMENTO (localStorage com reserva em memória)
     As chaves são as mesmas da versão anterior, então os dados
     já salvos no navegador continuam funcionando.
     ========================================================= */
  var KEY_MASTER = 'rh_app_master_auth';
  var KEY_INDEX = 'rh_app_companies_index';
  var KEY_SEEDED = 'rh_app_seeded';
  var SUFFIXES = ['empresa', 'cargos', 'funcionarios', 'avaliacoes', 'feedbacks', 'politicas', 'missao', 'auth', 'analises', 'tabela'];
  var memory = {};
  var storageOk = true;
  var warned = false;

  function rawGet(k) {
    try { var v = localStorage.getItem(k); return v === null ? (k in memory ? memory[k] : null) : v; }
    catch (e) { storageOk = false; return k in memory ? memory[k] : null; }
  }
  function rawSet(k, v) {
    try { localStorage.setItem(k, v); delete memory[k]; }
    catch (e) {
      storageOk = false; memory[k] = v;
      if (!warned) { warned = true; toast('O navegador não conseguiu gravar (armazenamento cheio ou bloqueado). Exporte um backup agora.', true); }
    }
  }
  function rawDel(k) {
    try { localStorage.removeItem(k); } catch (e) { storageOk = false; }
    delete memory[k];
  }
  function readJson(k, def) {
    try { var r = rawGet(k); return r === null ? def : JSON.parse(r); } catch (e) { return def; }
  }
  function writeJson(k, v) { rawSet(k, JSON.stringify(v)); }

  function ckey(id, s) { return 'rh_app_' + id + '_' + s; }
  function load(id, s, def) { return readJson(ckey(id, s), def); }
  function save(id, s, v) { writeJson(ckey(id, s), v); }
  function getIndex() { var l = readJson(KEY_INDEX, []); return Array.isArray(l) ? l : []; }
  function setIndex(l) { writeJson(KEY_INDEX, l); }
  function wipeCompany(id) {
    SUFFIXES.forEach(function (s) { rawDel(ckey(id, s)); });
    setIndex(getIndex().filter(function (c) { return c.id !== id; }));
  }

  /* =========================================================
     SENHAS (SHA-256 + salt, com reserva djb2)
     Na verificação aceitamos os dois formatos, para que uma senha
     criada num contexto do navegador continue valendo em outro.
     ========================================================= */
  function genSalt() {
