<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma Maker — Simulação de RH</title>
<style>
  :root {
    color-scheme: light;
    --accent: #b85d19;
    --accent-text: #96470c;
    --bg: #f2f3f5;
    --surface: #ffffff;
    --sidebar: #1b2128;
    --sidebar-text: #c7cbd1;
    --sidebar-hover: #262e38;
    --border: #d5d8dc;
    --text: #22262a;
    --muted: #5f6670;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --header-h: 42px;
    --subbar-h: 36px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-size: 13px; line-height: 1.4; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .print-only { display: none; }

  /* ---------- Estrutura ---------- */
  .erp { display: flex; min-height: 100vh; flex-direction: column; }
  .topbar {
    min-height: var(--header-h); background: #14181d; color: #eaedf0;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 6px; padding: 4px 14px; border-bottom: 1px solid #0a0c0e;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; letter-spacing: .3px; }
  .brand i { color: #f59e0b; font-style: normal; }
  .brand-sub { font-size: 10px; background: #262e38; color: #a4abb5; padding: 2px 6px; text-transform: uppercase; font-weight: 600; }
  .top-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .top-company { font-size: 11px; color: #9ca3af; margin-right: 8px; }
  .top-company strong { color: #fff; }

  .body { display: flex; flex: 1; }
  .sidebar { width: 230px; background: var(--sidebar); color: var(--sidebar-text); display: flex; flex-direction: column; flex-shrink: 0; }
  .chip { padding: 10px 14px; border-bottom: 1px solid #2f3844; background: #161b21; }
  .chip-label { font-size: 10px; text-transform: uppercase; color: #868e96; font-weight: 600; }
  .chip-name { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav { list-style: none; margin: 0; padding: 6px 0; flex: 1; }
  .nav button {
    width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 14px; background: none; border: 0;
    border-left: 3px solid transparent; color: var(--sidebar-text); font-size: 12px; font-weight: 500; text-align: left; cursor: pointer;
  }
  .nav button:hover { background: var(--sidebar-hover); color: #fff; }
  .nav button.active { background: #242c36; color: #fff; border-left-color: var(--accent); font-weight: 600; }
  .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .nav-ico { width: 14px; text-align: center; opacity: .85; font-size: 11px; }
  .side-foot { padding: 10px 14px; font-size: 10.5px; color: #6b7280; border-top: 1px solid #11151a; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .subbar {
    min-height: var(--subbar-h); background: #fff; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; padding: 4px 16px;
  }
  .crumb { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .crumb strong { color: var(--text); }
  .subbar-actions { display: flex; gap: 6px; }
  .content { padding: 16px; flex: 1; }
  .foot {
    padding: 10px 16px; background: #e9ebed; border-top: 1px solid var(--border); font-size: 11px; color: #555d67;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px;
  }

  /* ---------- Botões ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 11px; font-weight: 600;
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 2px; background: #fff; color: var(--text);
    cursor: pointer; line-height: 1; white-space: nowrap;
  }
  .btn:hover { background: #f4f5f7; border-color: #bcc1c8; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn-primary { background: var(--accent); border-color: #9c4c0f; color: #fff; }
  .btn-primary:hover { background: #a55212; border-color: #833e0a; }
  .btn-danger { color: #b91c1c; border-color: #fca5a5; }
  .btn-danger:hover { background: #fef2f2; border-color: #ef4444; }
  .btn-danger.solid { background: #b91c1c; border-color: #991b1b; color: #fff; }
  .btn-danger.solid:hover { background: #991b1b; }
  .btn-sm { padding: 4px 7px; font-size: 10.5px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }

  /* ---------- Tabelas ---------- */
  .table-card { background: #fff; border: 1px solid var(--border); overflow: hidden; }
  .toolbar {
    padding: 8px 12px; background: #fafbfc; border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
  }
  .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .toolbar-title { font-weight: 700; font-size: 12px; text-transform: uppercase; }
  .table-scroll { overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
  .tbl th {
    background: #ebedf0; color: #374151; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .3px;
    padding: 7px 10px; border-bottom: 1px solid var(--border); border-right: 1px solid #e1e4e8; white-space: nowrap;
  }
  .tbl td { padding: 6px 10px; border-bottom: 1px solid #edf0f2; border-right: 1px solid #f2f4f6; vertical-align: middle; height: 32px; }
  .tbl th:last-child, .tbl td:last-child { border-right: 0; }
  .tbl tbody tr:nth-child(even) td { background: #fafbfc; }
  .tbl tbody tr:hover td { background: #f0f4f8; }
  .tbl .num { text-align: right; }
  .tbl .ctr { text-align: center; }
  .tbl .acts { text-align: right; white-space: nowrap; }
  .tbl .acts .btn + .btn { margin-left: 4px; }
  .empty { text-align: center; padding: 20px !important; color: var(--muted); }

  /* ---------- Formulários ---------- */
  .inp, .sel, .txt {
    font-size: 12px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 2px; background: #fff; color: var(--text);
    font-family: inherit; max-width: 100%;
  }
  .inp:focus, .sel:focus, .txt:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .w100 { width: 100%; }
  .txt { resize: vertical; }
  .fg { margin-bottom: 10px; }
  .fl { display: block; font-size: 11px; font-weight: 600; margin-bottom: 3px; color: #495057; text-transform: uppercase; letter-spacing: .3px; }
  .hint { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .row { display: grid; gap: 10px; }
  .row.c2 { grid-template-columns: 1fr 1fr; }
  .row.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .row.c4 { grid-template-columns: repeat(4, 1fr); }
  .row.c5 { grid-template-columns: repeat(5, 1fr); }
  .row.w21 { grid-template-columns: 2fr 1fr; }
  .row.w211 { grid-template-columns: 2fr 1fr 1fr; }
  .avg-preview { margin-top: 8px; font-size: 12px; }

  /* ---------- Cards ---------- */
  .card { background: #fff; border: 1px solid var(--border); padding: 14px; margin-bottom: 14px; }
  .card-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; margin: 0 0 10px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border); color: #1e2329; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .grid-2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; }
  .grid-eq { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-an { display: grid; grid-template-columns: 240px 1fr; gap: 14px; }
  .grid-pol { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: #fff; border: 1px solid var(--border); padding: 10px 12px; border-left: 3px solid #6b7280; }
  .kpi.accent { border-left-color: var(--accent); }
  .kpi-label { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .kpi-val { font-size: 22px; font-weight: 700; color: #1b2128; line-height: 1.2; margin-top: 2px; }
  .kpi-val small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .kv { width: 100%; font-size: 12px; border-collapse: collapse; }
  .kv td { padding: 4px 0; vertical-align: top; }
  .kv td:first-child { color: var(--muted); width: 130px; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .quick .btn { padding: 10px 6px; }

  .didactic { background: #fdfaf6; border: 1px solid #f0d9c4; border-left: 3px solid var(--accent); padding: 8px 12px; margin-bottom: 12px; font-size: 11.5px; color: #4a3a2a; }
  .didactic-head {
    width: 100%; background: none; border: 0; padding: 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; text-transform: uppercase; font-size: 10.5px; letter-spacing: .4px; color: inherit; text-align: left;
  }
  .didactic-body { margin-top: 6px; line-height: 1.5; }
  .didactic.collapsed .didactic-body { display: none; }

  .tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; text-transform: uppercase; letter-spacing: .3px; border: 1px solid #d1d5db; background: #f3f4f6; color: #374151; border-radius: 2px; }
  .tag-green { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
  .tag-blue { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
  .tag-amber { background: #fffbeb; border-color: #fde68a; color: #92400e; }
  .tag-red { background: #fef2f2; border-color: #fecaca; color: #991b1b; }

  .notice { font-size: 11px; background: #f8fafc; border: 1px solid #cbd5e1; padding: 7px 10px; color: #475569; margin-top: 10px; line-height: 1.45; }
  .notice.warn { background: #fffbeb; border-color: #fde68a; color: #92400e; }
  .notice.danger { background: #fef2f2; border-color: #fecaca; color: #991b1b; }

  .cargo-list { list-style: none; margin: 0; padding: 4px 0; }
  .cargo-list li { border-bottom: 1px solid #f0f2f4; }
  .cargo-list button {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 8px 10px; background: none; border: 0;
    font-size: 11.5px; text-align: left; cursor: pointer; color: inherit;
  }
  .cargo-list button:hover { background: #f4f6f8; }
  .cargo-list button.sel { color: var(--accent-text); font-weight: 700; background: #fdf6ee; }
  .pol-body { font-size: 11.5px; color: #374151; line-height: 1.5; white-space: pre-line; max-height: 160px; overflow-y: auto; padding-right: 4px; }

  /* ---------- Seleção de empresa ---------- */
  .select-screen { min-height: 100vh; background: #0f1318; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .select-card { background: #fff; width: 100%; max-width: 700px; border: 1px solid #2d3748; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .select-head { background: #181f28; padding: 16px 20px; border-bottom: 2px solid var(--accent); color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .select-body { padding: 18px 20px; }
  .company-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--border); background: #fafbfc; margin-bottom: 8px; }
  .company-row:hover { background: #f1f4f8; }
  .company-actions { display: flex; gap: 5px; flex-wrap: wrap; }
  .dashed { padding: 24px; text-align: center; border: 1px dashed var(--border); background: #fafafa; font-size: 12px; color: var(--muted); }

  /* ---------- Modais ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(16,21,28,.65); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal { background: #fff; width: 100%; max-width: 580px; max-height: 92vh; display: flex; flex-direction: column; border: 1px solid #9aa0a6; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  .modal.lg { max-width: 760px; }
  .modal.sm { max-width: 400px; }
  .modal-head { background: #1b2128; color: #fff; padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin: 0; }
  .modal-x { background: transparent; border: 0; color: #9ca3af; cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; }
  .modal-x:hover { color: #fff; }
  .modal-body { padding: 14px; overflow-y: auto; flex: 1; }
  .modal-foot { background: #f7f8f9; padding: 8px 12px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 6px; }
  .modal form { display: flex; flex-direction: column; min-height: 0; flex: 1; }

  #toast-root { position: fixed; right: 16px; bottom: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: min(360px, calc(100vw - 32px)); }
  .toast { background: #1b2128; color: #fff; padding: 10px 14px; font-size: 12px; border-left: 3px solid #10b981; box-shadow: 0 4px 12px rgba(0,0,0,.3); border-radius: 2px; }
  .toast.err { border-left-color: #ef4444; }

  /* ---------- Responsivo ---------- */
  @media (max-width: 900px) {
    .body { flex-direction: column; }
    .sidebar { width: 100%; }
    .nav { display: flex; flex-wrap: wrap; }
    .nav li { flex: 1 1 50%; }
    .grid-2, .grid-eq, .grid-an { grid-template-columns: 1fr; }
    .row.c3, .row.c4, .row.w21, .row.w211 { grid-template-columns: 1fr 1fr; }
    .row.c5 { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 520px) {
    .row.c2, .row.c3, .row.c4, .row.w21, .row.w211 { grid-template-columns: 1fr; }
    .row.c5 { grid-template-columns: 1fr 1fr; }
    .content { padding: 10px; }
  }

  /* ---------- Impressão ---------- */
  @media print {
    .topbar, .sidebar, .subbar-actions, #modal-root, #toast-root, .btn, .toolbar, .didactic, .foot { display: none !important; }
    html, body, .main { background: #fff !important; color: #000 !important; }
    .print-only { display: block; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .card, .table-card, .kpi { border: 1px solid #000 !important; break-inside: avoid; }
    .content { padding: 0; }
    .table-scroll { overflow: visible; }
  }

  /* ---------- Fotos, tabela salarial e exportação ---------- */
  .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; background: #e5e7eb; flex-shrink: 0; }
  .avatar.ph { font-size: 11px; font-weight: 700; color: #4b5563; }
  .name-cell { display: flex; align-items: center; gap: 8px; }
  .photo-row { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; padding: 10px; border: 1px dashed var(--border); background: #fafbfc; }
  .photo-preview { width: 84px; height: 84px; flex-shrink: 0; border: 1px solid var(--border); background: #e5e7eb; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-preview span { font-size: 11px; color: var(--muted); text-align: center; padding: 4px; }
  .photo-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .gen-box { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 10px; padding: 8px 10px; background: #fdfaf6; border: 1px solid #f0d9c4; }
  .steps-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .check-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-bottom: 10px; }
  .check-list label { display: flex; align-items: center; gap: 7px; font-size: 12px; cursor: pointer; padding: 6px 8px; border: 1px solid var(--border); background: #fff; }
  .check-list label:hover { background: #f4f6f8; }
  .check-inline { display: flex; align-items: center; gap: 7px; font-size: 12px; cursor: pointer; padding: 6px 0; }
  #print-root { display: none; }
  .btn.sync { background: #262e38; border-color: #4b5563; color: #e5e7eb; }
  .btn.sync:hover { background: #2f3a47; }
  .btn.sync.ok { border-color: #10b981; color: #a7f3d0; }
  .btn.sync.warn { border-color: #f59e0b; color: #fde68a; }
  .btn.sync.bad { border-color: #ef4444; color: #fecaca; }
  .cloud-banner { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; margin-bottom: 12px; border: 1px solid #bfdbfe; background: #eff6ff; color: #1e40af; font-size: 11.5px; }
  .cloud-banner.bad { border-color: #fecaca; background: #fef2f2; color: #991b1b; }
  @media (max-width: 520px) {
    .gen-box { grid-template-columns: 1fr; }
    .steps-grid { grid-template-columns: 1fr 1fr; }
    .check-list { grid-template-columns: 1fr; }
    .photo-row { flex-direction: column; align-items: flex-start; }
  }

  /* ---------- Documento PDF (impressão das guias escolhidas) ---------- */
  @media print {
    body.printing-export #app, body.printing-export #modal-root, body.printing-export #toast-root { display: none !important; }
    body.printing-export #print-root { display: block !important; }
    body.printing-export { background: #fff !important; color: #000 !important; font-size: 10pt; }
    .pdoc-head { border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 12px; }
    .pdoc-brand { font-size: 9pt; text-transform: uppercase; letter-spacing: .5px; color: #444; }
    .pdoc-head h1 { font-size: 17pt; margin: 2px 0; }
    .pdoc-meta { font-size: 9pt; color: #444; }
    .psec { break-before: page; page-break-before: always; }
    .psec:first-of-type { break-before: auto; page-break-before: auto; }
    .psec h2 { font-size: 13pt; margin: 0 0 8px; padding-bottom: 4px; border-bottom: 1px solid #000; text-transform: uppercase; }
    .psec h3 { font-size: 11pt; margin: 14px 0 4px; }
    .ptbl { width: 100%; border-collapse: collapse; font-size: 9pt; margin-bottom: 10px; }
    .ptbl th, .ptbl td { border: 1px solid #888; padding: 4px 6px; text-align: left; vertical-align: middle; }
    .ptbl th { background: #e5e7eb !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .ptbl thead { display: table-header-group; }
    .ptbl tr { break-inside: avoid; page-break-inside: avoid; }
    .ptbl .num { text-align: right; }
    .ptbl .ctr { text-align: center; }
    .ptbl .k { width: 190px; font-weight: 700; background: #f3f4f6 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pimg { width: 38px; height: 38px; object-fit: cover; border-radius: 50%; display: block; }
    .ppara { font-size: 10pt; line-height: 1.5; white-space: pre-line; margin: 0 0 8px; }
    .pblock { break-inside: avoid; page-break-inside: avoid; margin-bottom: 12px; }
    .pblock ul, .pblock ol { margin: 4px 0 8px 18px; padding: 0; font-size: 10pt; }
    .pmuted { color: #555; }
  }
</style>
</head>
<body>
<noscript>Esta plataforma precisa de JavaScript habilitado para funcionar.</noscript>
<div id="app"></div>
<div id="modal-root"></div>
<div id="print-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept=".json,application/json" class="hidden">

<script>
(function () {
  'use strict';

  /* =========================================================
     CONEXÃO COM O GOOGLE SHEETS
     Cole entre as aspas o link do Apps Script (termina em /exec).
     Vazio = a plataforma usa só o armazenamento deste navegador.
     ========================================================= */
  var CLOUD_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbwAfDE7SgXSR5qzktV3iAwUyq8iGGL2-akTALGlEd1JXehS102iL2XsWvOBgnDuGIRP/exec';

  /* =========================================================
     ARMAZENAMENTO (localStorage com reserva em memória)
     As chaves são as mesmas da versão anterior, então os dados
     já salvos no navegador continuam funcionando.
     ========================================================= */
  var KEY_MASTER = 'rh_app_master_auth';
  var KEY_INDEX = 'rh_app_companies_index';
  var KEY_SEEDED = 'rh_app_seeded';
  var SUFFIXES = ['empresa', 'cargos', 'funcionarios', 'avaliacoes', 'feedbacks', 'politicas', 'missao', 'auth', 'analises', 'tabela', 'sync'];
  var memory = {};
  var storageOk = true;
  var warned = false;
  var session = { id: null };
  var muteSync = false;
  var KEY_CLOUD = 'rh_app_cloud_url';

  function rawGet(k) {
    try { var v = localStorage.getItem(k); return v === null ? (k in memory ? memory[k] : null) : v; }
    catch (e) { storageOk = false; return k in memory ? memory[k] : null; }
  }
  function rawSet(k, v) {
    try { localStorage.setItem(k, v); delete memory[k]; }
    catch (e) {

  /* =========================================================
     SENHAS (SHA-256 + salt, com reserva djb2)
     Na verificação aceitamos os dois formatos, para que uma senha
     criada num contexto do navegador continue valendo em outro.
     ========================================================= */
  function genSalt() {
    var a = new Uint8Array(16);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
    else for (var i = 0; i < 16; i++) a[i] = Math.floor(Math.random() * 256);
    return Array.prototype.map.call(a, function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  function djb2(str) {
    var h = 5381;
    for (var i = 0; i < str.length; i++) { h = ((h << 5) + h) + str.charCodeAt(i); h = h & h; }
    return Math.abs(h).toString(16).padStart(16, '0');
  }
  async function sha256(text) {
    if (!(window.crypto && crypto.subtle && crypto.subtle.digest)) return null;
    try {
      var d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.prototype.map.call(new Uint8Array(d), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    } catch (e) { return null; }
  }
  async function makeAuth(pass) {
    var salt = genSalt(), text = salt + '::' + pass;
    return { salt: salt, hash: (await sha256(text)) || djb2(text) };
  }
  async function checkAuth(auth, pass) {
    if (!auth || !auth.salt || !auth.hash) return false;
    var text = auth.salt + '::' + pass;
    var s = await sha256(text);
    return auth.hash === s || auth.hash === djb2(text);
  }
  function getMaster() { var m = readJson(KEY_MASTER, null); return m && m.hash ? m : null; }
  async function checkMaster(pass) { return checkAuth(getMaster(), pass); }

  function esc(t) {
    if (t === null || t === undefined) return '';
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }
  function uid(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function num(v, def) { var n = parseFloat(v); return isFinite(n) ? n : (def === undefined ? 0 : def); }
  function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
  function money(v) { return num(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
    return m ? m[3] + '/' + m[2] + '/' + m[1] : '-';
  }

  /* ---------- Tabela salarial ---------- */
  var N_STEPS = 5;
  var STEP_LABELS = ['A', 'B', 'C', 'D', 'E'];
  function normTabela(t) {
    t = t && typeof t === 'object' ? t : {};
    return {
      nome: str(t.nome), vigencia: str(t.vigencia), observacao: str(t.observacao),
      faixas: objs(t.faixas).map(function (x) {
        var steps = arr(x.steps).slice(0, N_STEPS).map(function (v) { return Math.max(0, num(v)); });
        while (steps.length < N_STEPS) steps.push(0);
        return { id: str(x.id) || uid('fx'), grau: str(x.grau), descricao: str(x.descricao), cargoId: str(x.cargoId), steps: steps };
      })
    };
  }
  function getTabela() { return normTabela(load(cid(), 'tabela', null)); }
  function salarioDe(f, tab) {
    if (!f || !f.faixaId) return null;
    var fx = tab.faixas.filter(function (x) { return x.id === f.faixaId; })[0];
    if (!fx) return null;
    var v = num(fx.steps[clamp(parseInt(f.step, 10) || 0, 0, N_STEPS - 1)]);
    return v > 0 ? v : null;
  }
  function enquadramento(f, tab) {
    var fx = f && f.faixaId ? tab.faixas.filter(function (x) { return x.id === f.faixaId; })[0] : null;
    return fx ? fx.grau + ' · Step ' + STEP_LABELS[clamp(parseInt(f.step, 10) || 0, 0, N_STEPS - 1)] : '';
  }
  function amplitude(fx) {
    var a = fx.steps[0], b = fx.steps[N_STEPS - 1];
    return a > 0 ? ((b / a - 1) * 100).toFixed(1).replace('.', ',') + '%' : '-';
  }
  function fmtVigencia(v) {
    var m = /^(\d{4})-(\d{2})$/.exec(v || '');
    return m ? m[2] + '/' + m[1] : '-';
  }
  function modTabela() {
    var tab = getTabela();
    var cargoMap = {};
    inCompany('cargos').forEach(function (c) { cargoMap[c.id] = c.nome; });
    var funcs = inCompany('funcionarios');
    var faixas = tab.faixas.slice().sort(function (a, b) { return a.steps[0] - b.steps[0]; });
    return didactic('did-tabela', 'Tabela Salarial e Enquadramento',
      'A <strong>tabela salarial</strong> organiza a remuneração em <strong>faixas</strong> (graus ou níveis). Cada faixa tem 5 <strong>steps</strong> (A a E), que representam a progressão salarial dentro da mesma faixa, por mérito ou tempo de casa.<br>' +
      'A <strong>amplitude</strong> mostra quanto o último step é maior que o primeiro. O <strong>enquadramento</strong> liga o colaborador a uma faixa e a um step, no cadastro dele; o salário passa a vir da tabela.<br>' +
      'Use <strong>Aplicar reajuste</strong> para simular dissídio ou revisão geral: todos os steps são multiplicados pelo percentual.') +
      '<div class="card"><div class="card-title"><span>Parâmetros da tabela</span></div><form data-submit="save-tabela-cfg">' +
      '<div class="row w21"><div class="fg"><label class="fl" for="t-nome">Nome da tabela</label><input id="t-nome" class="inp w100" name="nome" value="' + esc(tab.nome) + '" placeholder="Ex.: Tabela salarial 2026 — Administrativo"></div>' +
      '<div class="fg"><label class="fl" for="t-vig">Vigência (mês/ano)</label><input id="t-vig" type="month" class="inp w100" name="vigencia" value="' + esc(tab.vigencia) + '"></div></div>' +
      '<div class="fg"><label class="fl" for="t-obs">Observações / critérios de progressão</label><textarea id="t-obs" class="txt w100" name="observacao" rows="2" placeholder="Ex.: Progressão por mérito a cada 12 meses, com nota mínima 3,8 na avaliação.">' + esc(tab.observacao) + '</textarea></div>' +
      '<div style="text-align:right;"><button type="submit" class="btn btn-primary">Salvar parâmetros</button></div></form></div>' +
      '<div class="table-card"><div class="toolbar"><span class="toolbar-title">Faixas salariais (' + faixas.length + ')</span><div class="toolbar-group">' +
      '<button class="btn btn-sm" data-action="open-modal" data-modal="reajuste_form"' + (faixas.length ? '' : ' disabled') + '>Aplicar reajuste (%)</button>' +
      '<button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="faixa_form">+ Nova Faixa</button></div></div>' +
      '<div class="table-scroll"><table class="tbl"><thead><tr><th>Faixa</th><th>Descrição / cargo vinculado</th>' +
      STEP_LABELS.map(function (l) { return '<th class="num">Step ' + l + '</th>'; }).join('') +
      '<th class="num">Amplitude</th><th class="ctr">Colab.</th><th class="num">Ações</th></tr></thead><tbody>' +
      (faixas.length ? faixas.map(function (fx) {
        var n = funcs.filter(function (f) { return f.faixaId === fx.id; }).length;
        return '<tr><td><strong>' + esc(fx.grau) + '</strong></td><td>' + esc(fx.descricao || '-') +
          (fx.cargoId && cargoMap[fx.cargoId] ? '<div class="muted" style="font-size:10.5px;">Cargo: ' + esc(cargoMap[fx.cargoId]) + '</div>' : '') + '</td>' +
          fx.steps.map(function (v) { return '<td class="num">' + money(v) + '</td>'; }).join('') +
          '<td class="num">' + amplitude(fx) + '</td><td class="ctr">' + n + '</td>' +
          '<td class="acts"><button class="btn btn-sm" data-action="open-modal" data-modal="faixa_form" data-id="' + esc(fx.id) + '">Editar</button>' +
          '<button class="btn btn-danger btn-sm" data-action="del-faixa" data-id="' + esc(fx.id) + '">Excluir</button></td></tr>';
      }).join('') : '<tr><td colspan="10" class="empty">Nenhuma faixa cadastrada. Clique em "+ Nova Faixa" para montar a tabela.</td></tr>') +
      '</tbody></table></div></div>';
  }

  /* ---------- Análise ---------- */
  function modAnalise() {

      '<div class="grid-an"><div class="table-card" style="align-self:start;"><div class="toolbar" style="padding:6px 10px;"><span class="toolbar-title" style="font-size:11px;">Selecione o cargo</span></div>' +
      '<ul class="cargo-list">' + cargos.map(function (c) {

        return '<li><button class="' + (c.id === cargo.id ? 'sel' : '') + '" data-action="select-cargo" data-id="' + esc(c.id) + '"><span>' + esc(c.nome) + '</span>' +
          '<span class="tag ' + (ok ? 'tag-green' : 'tag-amber') + '" style="font-size:9px;">' + (ok ? 'Completo' : 'Pendente') + '</span></button></li>';
      }).join('') + '</ul></div>' +
      '<div class="card" style="margin-bottom:0;"><div class="card-title"><div>Ficha do Cargo: <strong>' + esc(cargo.nome) + '</strong> ' +
      '<span class="muted" style="font-size:10.5px;font-weight:400;">(' + esc(cargo.setor) + ' — ' + esc(cargo.nivel) + ')</span></div>' +

      '<div class="fg"><label class="fl" for="a-obj">Missão / objetivo principal da função</label><textarea id="a-obj" class="txt w100" name="objetivo" rows="2" required placeholder="Ex.: Gerenciar as rotinas de atendimento, coordenando o fluxo de demandas...">' + esc(fi.objetivo || '') + '</textarea></div>' +
      '<div class="fg"><label class="fl" for="a-resp">Principais responsabilidades e atribuições (uma por linha)</label><textarea id="a-resp" class="txt w100" name="responsabilidades" rows="4" style="font-family:var(--mono);font-size:11.5px;" placeholder="Executar fechamento de ponto mensal&#10;Emitir relatórios de absenteísmo">' + esc(arr(fi.responsabilidades).join('\n')) + '</textarea>' +

      '<div class="row c2"><div class="fg"><label class="fl" for="a-tec">Competências técnicas (hard skills)</label><textarea id="a-tec" class="txt w100" name="tecnicas" rows="2" placeholder="Ex.: Excel intermediário, conhecimento em CLT...">' + esc(req.tecnicas || '') + '</textarea></div>' +
      '<div class="fg"><label class="fl" for="a-comp">Competências comportamentais (soft skills)</label><textarea id="a-comp" class="txt w100" name="comportamentais" rows="2" placeholder="Ex.: Comunicação assertiva, trabalho em equipe...">' + esc(req.comportamentais || '') + '</textarea></div></div>' +

      '<div style="text-align:right;"><button type="submit" class="btn btn-primary">Gravar Ficha do Cargo</button></div></form></div></div>';
  }

  /* ---------- Colaboradores ---------- */
  function iniciais(nome) {
    var p = str(nome).trim().split(/\s+/).filter(Boolean);

    return (p[0].charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : '')).toUpperCase();
  }
  function isPhoto(v) { return typeof v === 'string' && v.length < 600000 && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(v); }
  function avatar(f) {
    if (isPhoto(f.foto)) return '<img class="avatar" src="' + esc(f.foto) + '" alt="Foto de ' + esc(f.nome) + '">';

      '<button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="func_form">+ Novo Colaborador</button></div>' +

          '<button class="btn btn-danger btn-sm" data-action="del-func" data-id="' + esc(f.id) + '">Excluir</button></td></tr>';
      }).join('') : '<tr><td colspan="9" class="empty">' + (all.length ? 'Nenhum colaborador encontrado para os filtros aplicados.' : 'Nenhum colaborador registrado.') + '</td></tr>') +
      '</tbody></table></div></div>';

  /* ---------- Políticas ---------- */
  function modPoliticas() {

  /* =========================================================

     ========================================================= */
  function modalShell(title, body, foot, size) {
    return '<div class="overlay" data-overlay><div class="modal ' + (size || '') + '" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="modal-head"><h2 class="modal-title">' + esc(title) + '</h2><button type="button" class="modal-x" data-action="close-modal" aria-label="Fechar">&times;</button></div>' +
      body + '</div></div>';
  }
  function formModal(title, submit, body, okLabel, size, cancelAction, extra) {
    return modalShell(title,
      '<form data-submit="' + submit + '" ' + (extra || '') + '><div class="modal-body">' + body + '</div>' +
      '<div class="modal-foot">' + (cancelAction || '<button type="button" class="btn" data-action="close-modal">Cancelar</button>') +
      '<button type="submit" class="btn btn-primary">' + okLabel + '</button></div></form>', '', size);
  }
  function pwField(label, name, opts) {
    opts = opts || {};
    return '<div class="fg"><label class="fl">' + label + '</label><input type="password" class="inp w100" name="' + name + '" required ' +
      (opts.min ? 'minlength="4" ' : '') + (opts.auto ? 'autocomplete="' + opts.auto + '" ' : '') + (opts.focus ? 'data-autofocus ' : '') + '></div>';
  }
  function companyName(id) {
    var c = mergedCompanies().filter(function (x) { return x.id === id; })[0];
    return c ? c.nome : '';
  }

  /* =========================================================
     RENDERIZAÇÃO
     ========================================================= */
  function renderApp() {
    var root = document.getElementById('app');
    root.innerHTML = cid() ? viewWorkspace() : viewSelect();
    document.title = 'Plataforma Maker — Simulação de RH';
  }
  function renderModule() {
    var el = document.getElementById('module');
    if (el) el.innerHTML = viewModule(); else renderApp();
  }
  function renderModal() {
    var root = document.getElementById('modal-root');
    root.innerHTML = viewModal();
    if (state.modal) {
      var first = root.querySelector('[data-autofocus]') || root.querySelector('input:not([type=hidden]), select, textarea');
      if (first) first.focus();
      var avg = root.querySelector('[data-avg]');
      if (avg) updateAvg(root.querySelector('form'));
    }
  }
  function refresh() { renderApp(); renderModal(); }

  function openModal(name, data) {
    state.modal = name; state.modalData = data || {}; renderModal();
    if (name === 'master_panel' && cloudOn()) loadMasterInfo();
  }
  function closeModal() { state.modal = null; state.modalData = {}; renderModal(); }
  function askConfirm(opts) { openModal('confirm', opts); }

  function updateAvg(form) {
    if (!form) return;
    var av = {};
    COMPETENCIAS.forEach(function (c) { av[c[0]] = form.elements['n_' + c[0]].value; });
    var m = calcMedia(av), q = conceito(m);
    var out = form.querySelector('[data-avg]');
    if (out) out.innerHTML = 'Média: <strong>' + m.toFixed(2).replace('.', ',') + '</strong> — <span class="tag ' + q.tag + '">' + q.texto + '</span>';
  }

  var actions = {
    'open-modal': function (el) { openModal(el.dataset.modal, el.dataset.id ? { id: el.dataset.id } : {}); },
    'close-modal': function () { closeModal(); },
    'set-tab': function (el) { state.tab = el.dataset.tab; resetFilters(); renderApp(); window.scrollTo(0, 0); },
    'exit-company': async function () {
      if (session.id && session.linked && session.dirty) {
        toast('Enviando alterações pendentes...');
        await pushNow(false);
        if (session.status === 'conflict') return;
        if (session.dirty) {
          return askConfirm({
            title: 'Alterações não enviadas', danger: true, label: 'Sair mesmo assim',
            message: 'Algumas alterações ainda não chegaram à planilha. Elas ficam salvas neste navegador e serão oferecidas para envio no próximo acesso. Sair agora?',
            run: function () { closeModal(); leaveCompany(); }
          });
        }
      }
      leaveCompany();
    },
    'sync-now': async function () {
      var s = session;
      if (!s.id) return;
      if (!s.linked) return pushNow(false);
      if (s.status === 'conflict') return openModal('conflict', {});
      if (s.dirty) return pushNow(false);
      if (s.newer) return pullNow();
      await checkNewer();
      if (session === s && s.newer) return pullNow();
      if (session === s && s.status === 'saved') toast('Tudo sincronizado.');
    },
    'conflict-pull': function () { closeModal(); pullNow(); },
    'conflict-force': function () { closeModal(); pushNow(true); },
    'login-use-remote': function () {
      var d = state.modalData;
      muteSync = true;
      try { applyRemote(d.id, d.r); } finally { muteSync = false; }
      enterLinked(d.id, d.proofs, d.r.versao);
    },
    'login-keep-local': function () {
      var d = state.modalData;
      muteSync = true;
      try { if (d.r.bundle && d.r.bundle.auth) save(d.id, 'auth', d.r.bundle.auth); } finally { muteSync = false; }
      enterLinked(d.id, d.proofs, d.r.versao, { dirty: true });
    },
    'cloud-refresh': function () { refreshCloudList(); },
    'cloud-test': async function () {
      var r = await cloudCall('ping', null, { timeout: 20000 });

    'select-cargo': function (el) { state.analiseCargoId = el.dataset.id; renderModule(); },
    'gen-steps': function (el) {
      var f = el.closest('form');
      var base = parseFloat(f.elements.gen_base.value), pct = parseFloat(f.elements.gen_pct.value);
      if (!isFinite(base) || base <= 0) return toast('Informe o valor inicial para gerar os steps.', true);
      if (!isFinite(pct) || pct < 0) pct = 0;
      for (var i = 0; i < N_STEPS; i++) f.elements['step' + i].value = (Math.round(base * Math.pow(1 + pct / 100, i) * 100) / 100).toFixed(2);
    },

  /* =========================================================
     FORMULÁRIOS (envio)
     ========================================================= */
  function val(f, n) { return (f.elements[n] ? f.elements[n].value : '').trim(); }
  function upsert(key, item) {
    var l = inCompany(key), i = l.findIndex(function (x) { return x.id === item.id; });
    if (i >= 0) l[i] = item; else l.push(item);
    save(cid(), key, l);
  }

  var submits = {
    'login': async function (f) {
      var id = val(f, 'id'), pass = val(f, 'pass');
      var entry = cloudEntry(id);
      if (cloudOn() && (entry || (state.cloud.listFailed && isNuvemMeta(id)))) return cloudLogin(id, pass, entry);
      var auth = load(id, 'auth', null);
      if (auth) {
        if (!(await checkAuth(auth, pass))) { toast('Senha incorreta. Tente novamente.', true); f.elements.pass.select(); return; }
      } else {
        if (pass.length < 4) return toast('A senha deve ter no mínimo 4 caracteres.', true);
        if (pass !== val(f, 'pass2')) return toast('A confirmação de senha não confere.', true);
        save(id, 'auth', await makeAuth(pass));
      }
      await beginSession(id, pass);
    },

    'create-company': async function (f) {
      var nome = val(f, 'nome'), p1 = f.elements.pass.value, p2 = f.elements.pass2.value;
      if (!nome) return toast('Informe o nome da empresa.', true);
      if (p1.length < 4) return toast('A senha deve ter no mínimo 4 caracteres.', true);
      if (p1 !== p2) return toast('A confirmação de senha não confere.', true);
      var id = uid('emp');
      var meta = { id: id, nome: nome, segmento: val(f, 'segmento') || 'Serviços Gerais', porte: f.elements.porte.value || 'Pequena', criadoEm: new Date().toLocaleDateString('pt-BR') };
      var idx = getIndex(); idx.push(meta); setIndex(idx);
      save(id, 'auth', await makeAuth(p1));
      save(id, 'empresa', {
        id: id, nome: nome, cnpj: '00.000.000/0001-00', segmento: meta.segmento, porte: meta.porte,
        numFuncionariosEstimado: parseInt(f.elements.num_func.value, 10) || 10, cidadeUf: val(f, 'cidade_uf') || 'Brasil',
        anoFundacao: parseInt(f.elements.ano.value, 10) || new Date().getFullYear(),
        descricao: val(f, 'descricao') || 'Empresa fictícia criada para simulação didática de RH.'
      });
      save(id, 'missao', { missao: 'Prover produtos e serviços de excelência valorizando colaboradores e clientes.', visao: 'Ser referência ética no setor.', valores: ['Transparência', 'Respeito', 'Foco no Cliente'] });
      ['cargos', 'funcionarios', 'avaliacoes', 'feedbacks', 'politicas'].forEach(function (k) { save(id, k, []); });
      save(id, 'analises', {});
      await beginSession(id, p1);
      toast('Empresa "' + nome + '" criada. Acesso liberado.');
      if (cloudOn()) pushNow(false);
    },

    'rename-company': function (f) {
      var id = val(f, 'id'), nome = val(f, 'new_name');
      if (!nome) return;
      var idx = getIndex(), it = idx.filter(function (c) { return c.id === id; })[0];
      if (it) it.nome = nome;
      setIndex(idx);
      var emp = load(id, 'empresa', {}) || {}; emp.nome = nome; save(id, 'empresa', emp);
      closeModal(); renderApp();
    },

    'delete-company': async function (f) {
      var id = val(f, 'id');
      if (f.elements.word.value.trim() !== 'EXCLUIR') return toast('Digite exatamente a palavra EXCLUIR.', true);
      var nome = companyName(id), entry = cloudEntry(id);

     ========================================================= */
  function processPhoto(file, cb) {
    if (!/^image\//.test(file.type)) return cb(new Error('Selecione um arquivo de imagem (JPG, PNG ou WebP).'));
    if (file.size > 12 * 1024 * 1024) return cb(new Error('Imagem muito grande (limite de 12 MB).'));
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      try {
        var S = 200, c = document.createElement('canvas');
        c.width = S; c.height = S;
        var ctx = c.getContext('2d'), side = Math.min(img.naturalWidth, img.naturalHeight);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, S, S);
        ctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, S, S);
        var q = 0.72, out = c.toDataURL('image/jpeg', q);
        while (out.length > 42000 && q > 0.3) { q -= 0.15; out = c.toDataURL('image/jpeg', q); }
        cb(null, out);
      } catch (e) { cb(new Error('Não foi possível processar a imagem.')); }
      URL.revokeObjectURL(url);
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(new Error('Não foi possível ler a imagem. Tente outro arquivo (JPG ou PNG).')); };
    img.src = url;
  }

    var box = form.querySelector('[data-photo-preview]'), v = form.elements.foto.value;
    if (box) box.innerHTML = isPhoto(v) ? '<img alt="Foto do colaborador" src="' + esc(v) + '">' : '<span>Sem foto</span>';

    if (!rows.length) return '<p class="ppara pmuted">' + esc(empty || 'Sem registros.') + '</p>';
    return '<table class="ptbl"><thead><tr>' + heads.map(function (h) { return '<th' + (h[1] ? ' class="' + h[1] + '"' : '') + '>' + esc(h[0]) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr>' + r.map(function (c, i) { return '<td' + (heads[i][1] ? ' class="' + heads[i][1] + '"' : '') + '>' + c + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table>';
  }
  function pkv(rows) {
    return '<table class="ptbl">' + rows.map(function (r) { return '<tr><td class="k">' + esc(r[0]) + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</table>';

  function storeBundle(id, p, o) {

    muteSync = true;

      var nome = o.nome || str(p.empresa.nome).trim();

      }));

      if (fx && !fx.disabled && !fx.value && t.value) {
        for (var i = 0; i < fx.options.length; i++) { if (fx.options[i].dataset.cargo === t.value) { fx.value = fx.options[i].value; break; } }
      }
    }
    if (t.matches && t.matches('[data-on="foto-file"]')) {
      var file = t.files && t.files[0], form = t.form;
      t.value = '';
      if (!file) return;
      processPhoto(file, function (err, data) {
        if (err) return toast(err.message, true);
        form.elements.foto.value = data; previewPhoto(form);
      });
    }
  });

  document.addEventListener('mousedown', function (e) {
    if (e.target.hasAttribute && e.target.hasAttribute('data-overlay')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.modal) closeModal();
  });

  document.getElementById('import-file').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) return toast('Arquivo muito grande (limite de 5 MB).', true);
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var res = importBundle(JSON.parse(reader.result));
        state.companyId = null; state.tab = 'dashboard'; refresh();
        openModal('login_company', { id: res.id });
        toast(res.hasAuth ? 'Empresa importada. Use a senha original do backup para entrar.' : 'Empresa importada. Defina uma senha para entrar.');
      } catch (err) { toast('Erro ao importar backup: ' + err.message, true); }
    };
    reader.onerror = function () { toast('Não foi possível ler o arquivo.', true); };
    reader.readAsText(file);
  });

  /* =========================================================
     INICIALIZAÇÃO
     ========================================================= */
  (async function init() {
    renderApp();
    if (cloudOn()) refreshCloudList();
  })();
})();
</script>
</body>
</html>
